<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .kolam-bg { fill: #780000; }
    .kolam-pattern { fill: none; stroke: white; stroke-width: 0.8; stroke-linecap: round; }
    .kolam-dot { fill: white; }
  </style>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" class="kolam-bg"/>
  
  <!-- Simplified Kolam pattern optimized for small size -->
  <!-- Central diamond -->
  <path d="M16 8 L20 12 L16 16 L12 12 Z" class="kolam-pattern"/>
  <circle cx="16" cy="12" r="0.8" class="kolam-dot"/>
  
  <!-- Top -->
  <path d="M16 4 L18 6 L16 8 L14 6 Z" class="kolam-pattern"/>
  <circle cx="16" cy="6" r="0.6" class="kolam-dot"/>
  
  <!-- Left diamond -->
  <path d="M8 12 L12 16 L8 20 L4 16 Z" class="kolam-pattern"/>
  <circle cx="8" cy="16" r="0.8" class="kolam-dot"/>
  
  <!-- Right diamond -->
  <path d="M24 12 L28 16 L24 20 L20 16 Z" class="kolam-pattern"/>
  <circle cx="24" cy="16" r="0.8" class="kolam-dot"/>
  
  <!-- Central large diamond -->
  <path d="M10 14 L16 20 L22 14 L16 8" class="kolam-pattern"/>
  <circle cx="16" cy="14" r="0.6" class="kolam-dot"/>
  <circle cx="13" cy="11" r="0.5" class="kolam-dot"/>
  <circle cx="19" cy="11" r="0.5" class="kolam-dot"/>
  <circle cx="13" cy="17" r="0.5" class="kolam-dot"/>
  <circle cx="19" cy="17" r="0.5" class="kolam-dot"/>
  
  <!-- Bottom diamond -->
  <path d="M16 24 L20 20 L16 16 L12 20 Z" class="kolam-pattern"/>
  <circle cx="16" cy="20" r="0.8" class="kolam-dot"/>
  
  <!-- Bottom -->
  <path d="M16 28 L18 26 L16 24 L14 26 Z" class="kolam-pattern"/>
  <circle cx="16" cy="26" r="0.6" class="kolam-dot"/>
  
  <!-- Connecting curves -->
  <path d="M12 12 Q14 14 16 12" class="kolam-pattern"/>
  <path d="M16 12 Q18 14 20 12" class="kolam-pattern"/>
  <path d="M12 20 Q14 18 16 20" class="kolam-pattern"/>
  <path d="M16 20 Q18 18 20 20" class="kolam-pattern"/>
</svg>